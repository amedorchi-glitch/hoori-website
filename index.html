<script>
document.addEventListener('DOMContentLoaded', () => {
'use strict';

const API = 'https://mttcthmicgnryolaxxdy.supabase.co/rest/v1';
const KEY = 'sb_publishable_P6QG6ILA-DN1_GpHwGnz2w_mn5DPwT7';
const ADMIN_PASSWORD = 'Hoori1405';

let tickets = [];
let hooris = [];
let isAdmin = false;

const $ = id => document.getElementById(id);

function escapeHTML(value) {
    return String(value ?? '').replace(/[&<>"']/g, ch => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
    })[ch]);
}

function showToast(message) {
    const toast = $('toast');
    toast.textContent = message;
    toast.classList.add('show');

    clearTimeout(showToast.timer);
    showToast.timer = setTimeout(() => {
        toast.classList.remove('show');
    }, 4000);
}

function localDate() {
    const d = new Date();
    const year = d.getFullYear();
    const month = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');

    return `${year}-${month}-${day}`;
}

async function apiRequest(path, options = {}) {
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 15000);

    try {
        const response = await fetch(API + path, {
            ...options,
            signal: controller.signal,
            cache: 'no-store',
            headers: {
                apikey: KEY,
                Authorization: `Bearer ${KEY}`,
                'Content-Type': 'application/json',
                ...(options.headers || {})
            }
        });

        const text = await response.text();
        let data = null;

        if (text) {
            try {
                data = JSON.parse(text);
            } catch {
                data = text;
            }
        }

        if (!response.ok) {
            const message =
                data && typeof data === 'object'
                    ? data.message || data.details || data.hint || JSON.stringify(data)
                    : String(data || response.statusText);

            throw new Error(`خطای دیتابیس (${response.status}): ${message}`);
        }

        return data;
    } catch (error) {
        if (error.name === 'AbortError') {
            throw new Error('زمان اتصال به دیتابیس تمام شد.');
        }

        throw error;
    } finally {
        clearTimeout(timeout);
    }
}

function go(id, button) {
    const section = $(id);

    if (!section) return;

    document.querySelectorAll('.section').forEach(item => {
        item.classList.remove('active');
    });

    section.classList.add('active');

    document.querySelectorAll('.nav').forEach(item => {
        item.classList.remove('active');
    });

    if (button && button.classList.contains('nav')) {
        button.classList.add('active');
    } else {
        const nav = [...document.querySelectorAll('.nav')]
            .find(item => item.getAttribute('onclick')?.includes(`'${id}'`));

        if (nav) nav.classList.add('active');
    }

    const titles = {
        dashboard: 'داشبورد مدیریتی',
        tickets: 'فهرست بلیت‌ها',
        register: 'ثبت بلیت جدید',
        hooris: 'فهرست هوری‌ها',
        admin: 'پنل مدیریت'
    };

    $('title').textContent = titles[id] || 'HOORI';

    $('sidebar').classList.remove('open');

    if (id === 'tickets') renderTickets();
    if (id === 'hooris') renderHooris();
}

function getHooriName(item) {
    if (typeof item === 'string') return item;

    return String(
        item?.name ??
        item?.hoori_name ??
        item?.title ??
        item?.hoori ??
        ''
    );
}

function updateHooriSelect() {
    const select = $('hooriSelect');
    const previous = select.value;

    select.innerHTML = '<option value="">انتخاب هوری</option>';

    const names = [...new Set([
        ...hooris.map(getHooriName),
        ...tickets.map(ticket => String(ticket.hoori_name || ''))
    ].filter(Boolean))];

    names.sort((a, b) => a.localeCompare(b, 'fa'));

    names.forEach(name => {
        const option = document.createElement('option');
        option.value = name;
        option.textContent = name;
        select.appendChild(option);
    });

    if (names.includes(previous)) {
        select.value = previous;
    }

    if (names.length === 0) {
        const option = document.createElement('option');
        option.value = '';
        option.textContent = 'هنوز هوری‌ای ثبت نشده است';
        select.appendChild(option);
    }
}

function updateStats() {
    $('nTickets').textContent = tickets.length.toLocaleString('fa-IR');
    $('nHooris').textContent = hooris.length.toLocaleString('fa-IR');

    const today = localDate();

    const todayCount = tickets.filter(ticket =>
        String(ticket.issue_date || '').slice(0, 10) === today
    ).length;

    $('nToday').textContent = todayCount.toLocaleString('fa-IR');
}

function renderRecent() {
    const container = $('recent');

    if (!tickets.length) {
        container.innerHTML =
            '<div class="empty">هنوز بلیتی ثبت نشده است.</div>';
        return;
    }

    container.innerHTML = `
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>کد بلیت</th>
                        <th>نام هوری</th>
                        <th>تاریخ</th>
                    </tr>
                </thead>
                <tbody>
                    ${tickets.slice(0, 5).map(ticket => `
                        <tr>
                            <td><span class="code">${escapeHTML(ticket.ticket_code)}</span></td>
                            <td>${escapeHTML(ticket.hoori_name)}</td>
                            <td>${escapeHTML(ticket.issue_date)}</td>
                        </tr>
                    `).join('')}
                </tbody>
            </table>
        </div>
    `;
}

function renderTickets() {
    const tbody = $('ticketRows');
    const search = ($('search')?.value || '').trim().toLocaleLowerCase('fa');

    const filtered = tickets.filter(ticket => {
        const code = String(ticket.ticket_code || '').toLocaleLowerCase('fa');
        const name = String(ticket.hoori_name || '').toLocaleLowerCase('fa');

        return code.includes(search) || name.includes(search);
    });

    if (!filtered.length) {
        tbody.innerHTML = `
            <tr>
                <td colspan="5" class="empty">
                    ${search ? 'نتیجه‌ای پیدا نشد.' : 'هنوز بلیتی ثبت نشده است.'}
                </td>
            </tr>
        `;
    } else {
        tbody.innerHTML = filtered.map((ticket, index) => `
            <tr>
                <td>${(index + 1).toLocaleString('fa-IR')}</td>
                <td><span class="code">${escapeHTML(ticket.ticket_code)}</span></td>
                <td>${escapeHTML(ticket.hoori_name)}</td>
                <td>${escapeHTML(ticket.issue_date)}</td>
                <td><span class="badge">ثبت‌شده</span></td>
            </tr>
        `).join('');
    }

    $('ticketCount').textContent =
        `${filtered.length.toLocaleString('fa-IR')} بلیت از ${tickets.length.toLocaleString('fa-IR')} بلیت`;
}

function renderHooris() {
    const container = $('hooriList');

    if (!hooris.length) {
        container.innerHTML =
            '<div class="empty">هوری‌ای در جدول دیتابیس پیدا نشد.</div>';
        return;
    }

    container.innerHTML = hooris.map(item => {
        const name = getHooriName(item);

        const count = tickets.filter(ticket =>
            String(ticket.hoori_name || '') === name
        ).length;

        return `
            <div class="hoori">
                <div class="star">✧</div>
                <h4>${escapeHTML(name || 'بدون نام')}</h4>
                <div class="sub">
                    ${count.toLocaleString('fa-IR')} بلیت ثبت‌شده
                </div>
            </div>
        `;
    }).join('');
}

async function loadAll() {
    $('dbStatus').textContent = 'بررسی...';
    $('dbDetail').textContent = 'در حال اتصال';

    try {
        const results = await Promise.allSettled([
            apiRequest('/hoori_tickets?select=*&order=created_at.desc'),
            apiRequest('/hooris?select=*')
        ]);

        const ticketResult = results[0];
        const hooriResult = results[1];

        if (ticketResult.status === 'fulfilled') {
            tickets = Array.isArray(ticketResult.value)
                ? ticketResult.value
                : [];
        } else {
            throw ticketResult.reason;
        }

        if (hooriResult.status === 'fulfilled') {
            hooris = Array.isArray(hooriResult.value)
                ? hooriResult.value
                : [];
        } else {
            hooris = [];
        }

        updateStats();
        renderTickets();
        renderRecent();
        renderHooris();
        updateHooriSelect();

        $('dbStatus').textContent = 'متصل';
        $('dbDetail').textContent = 'Supabase';

        if (hooriResult.status === 'rejected') {
            showToast(
                'بلیت‌ها بارگذاری شدند، اما فهرست هوری‌ها دریافت نشد: ' +
                hooriResult.reason.message
            );
        } else {
            showToast('اطلاعات با موفقیت به‌روزرسانی شد.');
        }
    } catch (error) {
        $('dbStatus').textContent = 'خطا';
        $('dbDetail').textContent = 'اتصال ناموفق';

        $('ticketRows').innerHTML = `
            <tr>
                <td colspan="5" class="empty">
                    دریافت اطلاعات ناموفق بود.
                </td>
            </tr>
        `;

        $('recent').innerHTML =
            '<div class="empty">دریافت اطلاعات ناموفق بود.</div>';

        showToast(error.message || 'خطا در اتصال به دیتابیس.');
    }
}

$('ticketForm').addEventListener('submit', async event => {
    event.preventDefault();

    const button = $('submitTicket');
    const code = $('ticketCode').value.trim();
    const name = $('hooriSelect').value;
    const date = $('issueDate').value;

    if (!code || !name || !date) {
        showToast('لطفاً تمام فیلدها را تکمیل کن.');
        return;
    }

    if (tickets.some(ticket =>
        String(ticket.ticket_code || '').toLowerCase() === code.toLowerCase()
    )) {
        showToast('این کد بلیت قبلاً ثبت شده است.');
        return;
    }

    button.disabled = true;
    button.textContent = 'در حال ثبت...';

    try {
        await apiRequest('/hoori_tickets', {
            method: 'POST',
            headers: {
                Prefer: 'return=representation'
            },
            body: JSON.stringify({
                ticket_code: code,
                hoori_name: name,
                issue_date: date
            })
        });

        $('ticketForm').reset();
        $('issueDate').value = localDate();

        showToast('بلیت با موفقیت ثبت شد.');

        await loadAll();
        go('tickets');
    } catch (error) {
        showToast(
            'ثبت بلیت انجام نشد: ' + error.message
        );
    } finally {
        button.disabled = false;
        button.textContent = '✓ ثبت بلیت';
    }
});

$('hooriForm').addEventListener('submit', async event => {
    event.preventDefault();

    if (!isAdmin) {
        showToast('ابتدا وارد پنل مدیریت شو.');
        return;
    }

    const input = $('newHoori');
    const name = input.value.trim();

    if (!name) {
        showToast('نام هوری را وارد کن.');
        return;
    }

    if (hooris.some(item =>
        getHooriName(item).toLocaleLowerCase('fa') ===
        name.toLocaleLowerCase('fa')
    )) {
        showToast('این هوری از قبل وجود دارد.');
        return;
    }

    const button = $('hooriForm').querySelector('button');
    button.disabled = true;
    button.textContent = 'در حال ثبت...';

    try {
        await apiRequest('/hooris', {
            method: 'POST',
            headers: {
                Prefer: 'return=representation'
            },
            body: JSON.stringify({
                name: name
            })
        });

        input.value = '';
        $('addPanel').classList.remove('show');

        showToast('هوری ثبت شد.');
        await loadAll();
    } catch (error) {
        showToast(
            'افزودن هوری ناموفق بود. نام ستون جدول را بررسی کن: ' +
            error.message
        );
    } finally {
        button.disabled = false;
        button.textContent = 'ثبت هوری';
    }
});

$('loginForm').addEventListener('submit', event => {
    event.preventDefault();

    if ($('password').value === ADMIN_PASSWORD) {
        isAdmin = true;

        $('loginBox').style.display = 'none';
        $('adminPanel').classList.add('show');
        $('addBtn').classList.add('show');

        showToast('ورود انجام شد.');
        $('password').value = '';
    } else {
        showToast('رمز عبور اشتباه است.');
    }
});

function logout() {
    isAdmin = false;

    $('loginBox').style.display = 'block';
    $('adminPanel').classList.remove('show');
    $('addBtn').classList.remove('show');
    $('addPanel').classList.remove('show');

    showToast('از پنل مدیریت خارج شدی.');
    go('dashboard');
}

$('ticketForm').addEventListener('reset', () => {
    setTimeout(() => {
        if ($('issueDate')) {
    $('issueDate').value = localDate();
}

loadAll();

window.go = go;
window.logout = logout;
});
</script>
