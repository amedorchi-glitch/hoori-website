<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HOORI</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Tahoma,Arial,sans-serif;
    background:#fffdf7;
    color:#222;
}

header{
    background:#fff;
    border-bottom:2px solid #d4af37;
    position:sticky;
    top:0;
    z-index:100;
}

.nav{
    max-width:1100px;
    margin:auto;
    padding:15px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
}

.logo{
    font-size:28px;
    font-weight:bold;
    color:#b78908;
}

.menu{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
}

button{
    font-family:inherit;
    cursor:pointer;
}

.menu button{
    padding:10px 14px;
    border:1px solid #d4af37;
    border-radius:10px;
    background:#fff;
    color:#8b6908;
}

.menu button:hover,
.menu button.active{
    background:#d4af37;
    color:#fff;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:30px 15px;
}

.page{
    display:none;
}

.page.active{
    display:block;
}

.hero{
    padding:70px 25px;
    text-align:center;
    border:1px solid #e3ce87;
    border-radius:25px;
    background:linear-gradient(135deg,#fff,#fff5cf);
    box-shadow:0 15px 40px #b58a1715;
}

.hero h1{
    font-size:60px;
    margin:0;
    color:#b78908;
}

.hero p{
    color:#777;
    line-height:2;
}

.card{
    background:#fff;
    border:1px solid #e3ce87;
    border-radius:18px;
    padding:20px;
    margin:15px 0;
    box-shadow:0 8px 25px #b58a1710;
}

.grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
}

.form{
    max-width:650px;
    margin:auto;
}

label{
    display:block;
    margin:12px 0 6px;
    font-weight:bold;
    color:#765a08;
}

input,select{
    width:100%;
    padding:14px;
    border:1px solid #d9c57e;
    border-radius:10px;
    background:#fff;
    font-size:15px;
    outline:none;
}

input:focus,select:focus{
    border-color:#b78908;
}

.btn{
    border:0;
    padding:12px 18px;
    border-radius:10px;
    margin-top:12px;
    font-weight:bold;
}

.gold{
    background:#c59b25;
    color:#fff;
}

.red{
    background:#bd3838;
    color:#fff;
}

.gray{
    background:#eee;
    color:#555;
}

.message{
    display:none;
    padding:12px;
    border-radius:10px;
    margin-top:12px;
}

.message.show{
    display:block;
}

.success{
    background:#e6f7e6;
    color:#267326;
}

.error{
    background:#ffe6e6;
    color:#9b2525;
}

.ticket{
    border:1px solid #d4af37;
    border-radius:18px;
    padding:20px;
    background:linear-gradient(135deg,#fff,#fff7d8);
}

.ticket.vip{
    border:2px solid #c49a21;
}

.empty{
    text-align:center;
    padding:30px;
    color:#888;
    border:1px dashed #d4af37;
    border-radius:15px;
}

.row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    padding:12px;
    border-bottom:1px solid #eee;
}

footer{
    text-align:center;
    padding:30px;
    margin-top:50px;
    border-top:1px solid #eee;
    color:#999;
}

@media(max-width:750px){
    .nav{
        flex-direction:column;
    }

    .menu{
        justify-content:center;
    }

    .grid{
        grid-template-columns:1fr;
    }

    .hero h1{
        font-size:45px;
    }
}
</style>
</head>

<body>

<header>
<div class="nav">

<div class="logo">HOORI</div>

<div class="menu">

<button onclick="go('home')">خانه</button>
<button onclick="go('hooris')">حوری‌ها</button>
<button onclick="go('register')">ثبت تیکت</button>
<button onclick="go('tickets')">تیکت‌ها</button>
<button onclick="go('admin')">مدیریت</button>

</div>

</div>
</header>


<div class="container">


<!-- HOME -->

<section id="home" class="page active">

<div class="hero">

<h1>HOORI</h1>

<p>
سامانه اختصاصی ثبت و مدیریت تیکت
</p>

<button class="btn gold" onclick="go('register')">
ثبت تیکت جدید
</button>

</div>

<div class="card">

<h2>⭐ حوری پیشنهادی</h2>

<div id="suggestedBox">
هنوز حوری پیشنهادی انتخاب نشده است.
</div>

</div>

</section>


<!-- HOORIS -->

<section id="hooris" class="page">

<h2>👑 حوری‌ها</h2>

<div id="hooriList" class="grid"></div>

</section>


<!-- REGISTER -->

<section id="register" class="page">

<h2>🎫 ثبت تیکت</h2>

<div class="card form">

<label>نام و نام خانوادگی</label>

<input
id="fullName"
type="text"
placeholder="نام و نام خانوادگی"
>


<label>حوری</label>

<select id="hooriSelect">
<option value="">انتخاب حوری</option>
</select>


<label>نوع تیکت</label>

<select id="ticketType">
<option value="normal">عادی</option>
<option value="vip">VIP</option>
</select>


<button
class="btn gold"
onclick="registerTicket()"
>
ثبت تیکت
</button>

<div id="registerMessage" class="message"></div>

</div>

</section>


<!-- TICKETS -->

<section id="tickets" class="page">

<h2>🎫 تیکت‌ها</h2>

<input
id="search"
type="text"
placeholder="جستجوی نام یا حوری..."
oninput="renderTickets()"
>

<br><br>

<div id="ticketList"></div>

</section>


<!-- ADMIN -->

<section id="admin" class="page">

<div id="loginBox" class="card form">

<h2>🔐 ورود مدیریت</h2>

<label>رمز مدیریت</label>

<input
id="adminPassword"
type="password"
placeholder="رمز مدیریت"
>

<button class="btn gold" onclick="loginAdmin()">
ورود
</button>

<div id="loginMessage" class="message"></div>

</div>


<div id="adminPanel" style="display:none">

<div class="card">

<h2>⚙️ پنل مدیریت</h2>

<button class="btn gray" onclick="logoutAdmin()">
خروج
</button>

</div>


<div class="card">

<h3>➕ افزودن حوری</h3>

<input
id="newHoori"
type="text"
placeholder="نام حوری"
>

<button class="btn gold" onclick="addHoori()">
افزودن
</button>

</div>


<div class="card">

<h3>⭐ حوری پیشنهادی</h3>

<select id="suggestSelect"></select>

<button class="btn gold" onclick="setSuggested()">
ذخیره
</button>

</div>


<div class="card">

<h3>مدیریت حوری‌ها</h3>

<div id="adminHooris"></div>

</div>


<div class="card">

<h3>مدیریت تیکت‌ها</h3>

<div id="adminTickets"></div>

</div>

</div>

</section>

</div>


<footer>
HOORI ©
</footer>


<script>

const ADMIN_PASSWORD = "Hoori1405";

let hoorIs = [];
let tickets = [];
let suggested = "";


/* ذخیره */

function saveData(){

    localStorage.setItem(
        "HOORI_HOORIS",
        JSON.stringify(hoorIs)
    );

    localStorage.setItem(
        "HOORI_TICKETS",
        JSON.stringify(tickets)
    );

    localStorage.setItem(
        "HOORI_SUGGESTED",
        suggested
    );
}


/* بارگذاری */

function loadData(){

    try{

        hoorIs =
            JSON.parse(
                localStorage.getItem("HOORI_HOORIS")
            ) || [];

        tickets =
            JSON.parse(
                localStorage.getItem("HOORI_TICKETS")
            ) || [];

        suggested =
            localStorage.getItem("HOORI_SUGGESTED")
            || "";

    }catch(e){

        hoorIs = [];
        tickets = [];
        suggested = "";

    }

}


/* تغییر صفحه */

function go(page){

    document.querySelectorAll(".page").forEach(
        function(item){
            item.classList.remove("active");
        }
    );

    const target =
        document.getElementById(page);

    if(target){
        target.classList.add("active");
    }

    document.querySelectorAll(".menu button").forEach(
        function(button){
            button.classList.remove("active");
        }
    );

    window.scrollTo(0,0);

    if(page === "home"){
        renderSuggested();
    }

    if(page === "hooris"){
        renderHooris();
    }

    if(page === "register"){
        loadHooriSelect();
    }

    if(page === "tickets"){
        renderTickets();
    }

    if(page === "admin"){
        renderAdmin();
    }
}


/* حوری‌ها */

function renderHooris(){

    const box =
        document.getElementById("hooriList");

    if(!hoorIs.length){

        box.innerHTML =
            '<div class="empty">هنوز حوری‌ای ثبت نشده است.</div>';

        return;
    }

    box.innerHTML =
        hoorIs.map(function(name){

            return `
                <div class="card">
                    <h3>👑 ${escapeText(name)}</h3>
                    <p>عضو سامانه HOORI</p>
                </div>
            `;

        }).join("");

}


/* انتخاب حوری */

function loadHooriSelect(){

    const select =
        document.getElementById("hooriSelect");

    select.innerHTML =
        '<option value="">انتخاب حوری</option>';

    hoorIs.forEach(function(name){

        const option =
            document.createElement("option");

        option.value = name;
        option.textContent = name;

        select.appendChild(option);

    });

}


/* ثبت تیکت */

function registerTicket(){

    const name =
        document
        .getElementById("fullName")
        .value
        .trim();

    const hoori =
        document
        .getElementById("hooriSelect")
        .value;

    const type =
        document
        .getElementById("ticketType")
        .value;

    const message =
        document.getElementById("registerMessage");


    if(!name){

        message.textContent =
            "نام و نام خانوادگی را وارد کن.";

        message.className =
            "message show error";

        return;
    }


    if(!hoori){

        message.textContent =
            "یک حوری انتخاب کن.";

        message.className =
            "message show error";

        return;
    }


    tickets.push({

        id: Date.now(),

        name: name,

        hoori: hoori,

        type: type,

        date: new Date().toLocaleString("fa-IR")

    });


    saveData();


    document.getElementById("fullName").value = "";


    message.textContent =
        "✅ تیکت با موفقیت ثبت شد.";

    message.className =
        "message show success";


    renderTickets();

}


/* تیکت‌ها */

function renderTickets(){

    const box =
        document.getElementById("ticketList");

    const searchInput =
        document.getElementById("search");

    const search =
        searchInput
        ? searchInput.value.toLowerCase().trim()
        : "";


    const result =
        tickets.filter(function(ticket){

            return (

                ticket.name
                .toLowerCase()
                .includes(search)

                ||

                ticket.hoori
                .toLowerCase()
                .includes(search)

            );

        });


    if(!result.length){

        box.innerHTML =
            '<div class="empty">تیکتی وجود ندارد.</div>';

        return;
    }


    box.innerHTML =
        result
        .slice()
        .reverse()
        .map(function(ticket){

            return `
                <div class="ticket ${ticket.type === "vip" ? "vip" : ""}">

                    <h3>
                        ${escapeText(ticket.name)}
                    </h3>

                    <p>
                        حوری:
                        ${escapeText(ticket.hoori)}
                    </p>

                    <p>
                        نوع:
                        ${ticket.type === "vip" ? "⭐ VIP" : "عادی"}
                    </p>

                    <p>
                        تاریخ:
                        ${escapeText(ticket.date)}
                    </p>

                    <button
                        class="btn gold"
                        onclick="printTicket(${ticket.id})"
                    >
                        🖨 چاپ
                    </button>

                </div>
            `;

        }).join("");

}


/* ورود مدیریت */

function loginAdmin(){

    const password =
        document
        .getElementById("adminPassword")
        .value;

    const message =
        document.getElementById("loginMessage");


    if(password === ADMIN_PASSWORD){

        document
        .getElementById("loginBox")
        .style.display = "none";

        document
        .getElementById("adminPanel")
        .style.display = "block";

        renderAdmin();

    }else{

        message.textContent =
            "❌ رمز مدیریت اشتباه است.";

        message.className =
            "message show error";

    }

}


/* خروج */

function logoutAdmin(){

    document
    .getElementById("adminPanel")
    .style.display = "none";

    document
    .getElementById("loginBox")
    .style.display = "block";

    document
    .getElementById("adminPassword")
    .value = "";

}


/* افزودن حوری */

function addHoori(){

    const input =
        document.getElementById("newHoori");

    const name =
        input.value.trim();


    if(!name){

        alert("نام حوری را وارد کن.");

        return;
    }


    if(hoorIs.includes(name)){

        alert("این حوری قبلاً اضافه شده.");

        return;
    }


    hoorIs.push(name);

    saveData();

    input.value = "";

    renderHooris();

    loadHooriSelect();

    renderAdmin();

    alert("✅ حوری اضافه شد.");

}


/* پیشنهاد */

function setSuggested(){

    const select =
        document.getElementById("suggestSelect");

    suggested = select.value;

    saveData();

    renderSuggested();

    alert("✅ ذخیره شد.");

}


/* نمایش پیشنهاد */

function renderSuggested(){

    const box =
        document.getElementById("suggestedBox");

    if(!suggested){

        box.textContent =
            "هنوز حوری پیشنهادی انتخاب نشده است.";

        return;
    }

    box.innerHTML =
        "<h3>⭐ " +
        escapeText(suggested) +
        "</h3>";

}


/* پنل مدیریت */

function renderAdmin(){

    const adminHooris =
        document.getElementById("adminHooris");

    const adminTickets =
        document.getElementById("adminTickets");

    const select =
        document.getElementById("suggestSelect");


    if(!adminHooris) return;


    /* حوری‌ها */

    if(!hoorIs.length){

        adminHooris.innerHTML =
            '<div class="empty">حوری‌ای وجود ندارد.</div>';

    }else{

        adminHooris.innerHTML =
            hoorIs.map(function(name,index){

                return `
                    <div class="row">

                        <span>
                            👑 ${escapeText(name)}
                        </span>

                        <button
                            class="btn red"
                            onclick="deleteHoori(${index})"
                        >
                            حذف
                        </button>

                    </div>
                `;

            }).join("");

    }


    /* پیشنهاد */

    select.innerHTML =
        '<option value="">بدون پیشنهاد</option>';

    hoorIs.forEach(function(name){

        const option =
            document.createElement("option");

        option.value = name;
        option.textContent = name;

        if(name === suggested){
            option.selected = true;
        }

        select.appendChild(option);

    });


    /* تیکت‌ها */

    if(!tickets.length){

        adminTickets.innerHTML =
            '<div class="empty">تیکتی وجود ندارد.</div>';

    }else{

        adminTickets.innerHTML =
            tickets
            .slice()
            .reverse()
            .map(function(ticket){

                return `
                    <div class="row">

                        <span>
                            ${escapeText(ticket.name)}
                            -
                            ${escapeText(ticket.hoori)}
                        </span>

                        <button
                            class="btn red"
                            onclick="deleteTicket(${ticket.id})"
                        >
                            حذف
                        </button>

                    </div>
                `;

            }).join("");

    }

}


/* حذف حوری */

function deleteHoori(index){

    if(!confirm("این حوری حذف شود؟")){
        return;
    }


    const deleted =
        hoorIs[index];

    hoorIs.splice(index,1);


    if(suggested === deleted){
        suggested = "";
    }


    saveData();

    renderHooris();

    loadHooriSelect();

    renderAdmin();

    renderSuggested();

}


/* حذف تیکت */

function deleteTicket(id){

    if(!confirm("این تیکت حذف شود؟")){
        return;
    }


    tickets =
        tickets.filter(function(ticket){

            return ticket.id !== id;

        });


    saveData();

    renderTickets();

    renderAdmin();

}


/* چاپ */

function printTicket(id){

    const ticket =
        tickets.find(function(item){

            return item.id === id;

        });


    if(!ticket){
        return;
    }


    const win =
        window.open("","_blank");


    if(!win){

        alert("مرورگر اجازه چاپ نداد.");

        return;
    }


    win.document.write(`

        <!DOCTYPE html>

        <html lang="fa" dir="rtl">

        <head>

        <meta charset="UTF-8">

        <title>HOORI</title>

        <style>

        body{
            font-family:Tahoma;
            padding:40px;
            text-align:center;
        }

        .ticket{
            max-width:500px;
            margin:auto;
            padding:35px;
            border:2px solid #d4af37;
            border-radius:20px;
        }

        h1{
            color:#b78908;
        }

        </style>

        </head>

        <body>

        <div class="ticket">

            <h1>HOORI</h1>

            <h2>
                ${escapeText(ticket.name)}
            </h2>

            <p>
                حوری:
                ${escapeText(ticket.hoori)}
            </p>

            <p>
                نوع:
                ${ticket.type === "vip" ? "VIP" : "عادی"}
            </p>

            <p>
                ${escapeText(ticket.date)}
            </p>

        </div>

        <script>

        window.onload = function(){
            window.print();
        };

        <\/script>

        </body>

        </html>

    `);

    win.document.close();

}


/* جلوگیری از HTML خراب */

function escapeText(value){

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


/* شروع */

loadData();

renderHooris();

loadHooriSelect();

renderTickets();

renderSuggested();

</script>

</body>
</html>
