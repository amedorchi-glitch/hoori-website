<script>
/* HOORI — اصلاح عملکرد دکمه‌ها */
document.addEventListener('DOMContentLoaded', () => {
  const $ = (selector, root = document) => root.querySelector(selector);
  const $$ = (selector, root = document) => [...root.querySelectorAll(selector)];

  window.go = function (page) {
    const target = document.getElementById('page-' + page);
    if (!target) return;

    $$('.page').forEach(el => el.classList.remove('active'));
    target.classList.add('active');

    $$('.nav-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.page === page);
    });

    $('#navLinks')?.classList.remove('open');
    window.scrollTo({ top: 0, behavior: 'smooth' });

    if (page === 'hooris' && typeof renderHooris === 'function') renderHooris();
    if (page === 'tickets' && typeof renderTickets === 'function') renderTickets();
    if (page === 'admin' && typeof renderAdmin === 'function') renderAdmin();
  };

  window.toggleMenu = function () {
    $('#navLinks')?.classList.toggle('open');
  };

  // بستن پنجره‌های مودال
  window.openModal = function (id) {
    document.getElementById(id)?.classList.add('open');
  };

  window.closeModal = function (id) {
    document.getElementById(id)?.classList.remove('open');
  };

  $$('.modal-overlay').forEach(modal => {
    modal.addEventListener('click', event => {
      if (event.target === modal) modal.classList.remove('open');
    });
  });

  document.addEventListener('keydown', event => {
    if (event.key === 'Escape') {
      $$('.modal-overlay.open').forEach(modal => modal.classList.remove('open'));
    }
  });

  // جست‌وجوی زنده در جدول‌های مدیریت
  document.addEventListener('input', event => {
    if (!event.target.matches('[data-search]')) return;

    const selector = event.target.dataset.search;
    const query = event.target.value.trim().toLocaleLowerCase('fa');

    $$(selector).forEach(row => {
      row.classList.toggle(
        'hidden',
        !row.textContent.toLocaleLowerCase('fa').includes(query)
      );
    });
  });

  // جلوگیری از ارسال ناخواسته فرم‌ها
  document.addEventListener('submit', event => {
    const form = event.target;
    if (!form.matches('[data-local-form]')) return;

    event.preventDefault();

    if (!form.reportValidity()) return;

    form.dispatchEvent(new CustomEvent('local-form-submit', {
      bubbles: true,
      detail: new FormData(form)
    }));
  });

  // چاپ بلیت
  window.printTicket = function () {
    if (!$('#printArea')) {
      alert('بخش چاپ بلیت پیدا نشد.');
      return;
    }
    window.print();
  };

  // نمایش پیام
  window.showToast = function (message, type = 'success') {
    let container = $('.toast-container');

    if (!container) {
      container = document.createElement('div');
      container.className = 'toast-container';
      document.body.appendChild(container);
    }

    const toast = document.createElement('div');
    toast.className = 'toast ' + (type === 'error' ? 'error' : 'success');
    toast.textContent = message;
    container.appendChild(toast);

    setTimeout(() => toast.remove(), 3500);
  };

  // فعال‌کردن دکمه‌های تغییر صفحه
  $$('[data-page]').forEach(button => {
    button.addEventListener('click', () => {
      window.go(button.dataset.page);
    });
  });

  // بازیابی صفحه اولیه
  const initialPage = location.hash.replace('#', '');
  if (initialPage && document.getElementById('page-' + initialPage)) {
    window.go(initialPage);
  }
});
</script>
