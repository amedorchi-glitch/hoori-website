<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#11100d">
<title>HOORI | Premium Ticket</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
:root{
    --gold:#e7c574;
    --gold2:#b58a35;
    --black:#11100d;
    --panel:#191813;
    --cream:#f8f5ec;
    --muted:#a7a398;
    --border:rgba(231,197,116,.18);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
    font-family:'Vazirmatn',sans-serif;
    background:var(--black);
    color:#f8f5ec;
    min-height:100vh;
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{
    outline:2px solid var(--gold);outline-offset:3px
}
button:disabled{opacity:.5;cursor:not-allowed}
::selection{background:var(--gold);color:#111}
a{color:inherit;text-decoration:none}
.topbar{
    position:sticky;top:0;z-index:50;
    background:rgba(17,16,13,.93);
    backdrop-filter:blur(18px);
    border-bottom:1px solid var(--border);
}
.nav{
    max-width:1350px;margin:auto;padding:15px 25px;
    display:flex;align-items:center;justify-content:space-between;gap:20px
}
.brand{display:flex;align-items:center;gap:12px;cursor:pointer}
.brand-mark{
    width:45px;height:45px;display:grid;place-items:center;
    border:1px solid var(--gold);color:var(--gold);
    font-size:24px;font-weight:900;transform:rotate(45deg);
    border-radius:12px
}
.brand-mark span{transform:rotate(-45deg)}
.brand-name{font-size:25px;letter-spacing:3px;font-weight:900}
.brand-name span{color:var(--gold)}
.navlinks{display:flex;align-items:center;gap:6px}
.navlinks button{
    border:0;background:transparent;color:#d0cec5;
    padding:11px 14px;border-radius:10px;font-size:13px;
    transition:.2s
}
.navlinks button:hover,.navlinks button.active{
    color:var(--gold);background:rgba(231,197,116,.08)
}
.navlinks .nav-admin{border:1px solid var(--border);color:var(--gold)}
.mobile-toggle{
    display:none;border:1px solid var(--border);color:var(--gold);
    background:transparent;border-radius:10px;padding:9px 12px
}
main{max-width:1350px;margin:auto;padding:25px}
.page{display:none;animation:appear .35s ease}
.page.active{display:block}
@keyframes appear{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hero{
    min-height:500px;border:1px solid var(--border);border-radius:30px;
    position:relative;overflow:hidden;display:flex;align-items:center;
    padding:65px;background:
    radial-gradient(ellipse at 85% 20%,rgba(206,166,74,.17),transparent 38%),
    radial-gradient(ellipse at 15% 90%,rgba(206,166,74,.1),transparent 35%),
    linear-gradient(125deg,#171610,#100f0c 65%,#211b0e);
}
.hero:before,.hero:after{
    content:"";position:absolute;border:1px solid rgba(231,197,116,.12);
    border-radius:50%;pointer-events:none
}
.hero:before{width:490px;height:490px;left:-140px;top:-160px}
.hero:after{width:350px;height:350px;left:-70px;top:-90px}
.hero-content{position:relative;z-index:2;max-width:720px}
.eyebrow{
    display:inline-flex;align-items:center;gap:10px;color:var(--gold);
    font-size:12px;letter-spacing:2px;border:1px solid var(--border);
    background:rgba(231,197,116,.05);padding:9px 15px;border-radius:30px;
    margin-bottom:25px
}
.eyebrow:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--gold)}
.hero h1{font-size:clamp(42px,6vw,78px);font-weight:900;line-height:1.25;margin-bottom:20px}
.hero h1 span{color:var(--gold)}
.hero p{color:#b8b5a9;line-height:2.2;max-width:590px;font-size:15px}
.hero-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:30px}
.btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    border:1px solid transparent;border-radius:12px;padding:13px 20px;
    font-weight:800;font-size:13px;transition:.25s
}
.btn-gold{background:linear-gradient(135deg,#f2d992,#bc8e35);color:#17140d}
.btn-gold:hover{transform:translateY(-2px);box-shadow:0 8px 25px #c29a3b30}
.btn-outline{border-color:var(--border);background:transparent;color:var(--gold)}
.btn-outline:hover{background:#e7c57412}
.btn-dark{background:#27251e;color:#f5f0df;border-color:#38352a}
.btn-danger{background:#361b18;color:#ffaaa0;border-color:#5b2924}
.btn-block{width:100%}
.hero-side{
    position:absolute;left:5%;top:50%;transform:translateY(-50%) rotate(-8deg);
    width:230px;height:300px;border:1px solid #e7c57470;border-radius:15px;
    padding:18px;background:linear-gradient(140deg,#252116,#0c0b09);
    box-shadow:0 30px 80px #0008;opacity:.88
}
.hero-side:before{content:"";position:absolute;inset:8px;border:1px solid #e7c5742b;border-radius:9px}
.hero-side .hs-logo{text-align:center;color:var(--gold);font-size:42px;font-weight:900;margin-top:15px}
.hero-side .hs-line{height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:15px 0}
.hero-side .hs-text{text-align:center;font-size:10px;letter-spacing:4px;color:#d6cba9}
.hero-side .hs-bottom{text-align:center;color:var(--gold);font-size:11px;margin-top:22px}
.stats{
    display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin:22px 0 45px
}
.stat{
    padding:23px;background:linear-gradient(135deg,#1d1b15,#15140f);
    border:1px solid var(--border);border-radius:18px;position:relative;overflow:hidden
}
.stat:after{content:"";position:absolute;left:-25px;bottom:-45px;width:90px;height:90px;border:1px solid #e7c57412;border-radius:50%}
.stat-top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px}
.stat-icon{color:var(--gold);font-size:21px}
.stat strong{display:block;font-size:30px;color:var(--gold);margin-top:12px}
.stat small{color:#888579;font-size:11px}
.section-head{display:flex;justify-content:space-between;align-items:end;gap:15px;margin:25px 0}
.section-head h2{font-size:27px;font-weight:900}
.section-head p{color:var(--muted);font-size:13px;margin-top:6px}
.kicker{color:var(--gold);font-size:10px;letter-spacing:2px;margin-bottom:7px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.hoori-card{
    background:linear-gradient(150deg,#201e17,#15140f);
    border:1px solid var(--border);border-radius:22px;overflow:hidden;transition:.3s
}
.hoori-card:hover{transform:translateY(-5px);border-color:#e7c57475;box-shadow:0 15px 40px #0004}
.hoori-art{
    height:175px;display:grid;place-items:center;position:relative;overflow:hidden;
    background:radial-gradient(circle at center,#594723 0,#2b2414 40%,#17150f 75%)
}
.hoori-art:before,.hoori-art:after{
    content:"";position:absolute;border:1px solid #e7c57438;border-radius:50%
}
.hoori-art:before{width:180px;height:180px}
.hoori-art:after{width:135px;height:135px}
.hoori-art span{z-index:1;font-size:54px;color:var(--gold);font-weight:900}
.hoori-card-body{padding:20px}
.hoori-card h3{font-size:19px}
.hoori-card p{color:var(--muted);font-size:12px;line-height:2;margin:9px 0 18px;min-height:42px;white-space:pre-wrap}
.card-bottom{display:flex;align-items:center;justify-content:space-between;gap:8px}
.price{font-weight:900;color:var(--gold);font-size:14px}
.muted{color:var(--muted)}
.panel{
    background:linear-gradient(145deg,#1b1a14,#14130f);
    border:1px solid var(--border);border-radius:22px;padding:25px;margin-bottom:20px
}
.panel h3{font-size:17px;margin-bottom:18px}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.field{display:flex;flex-direction:column;gap:8px}
.field.full{grid-column:1/-1}
.field label{font-size:12px;color:#d3cfbf;font-weight:700}
.field input,.field select,.field textarea,.search-input{
    width:100%;background:#100f0c;color:#f5f0df;border:1px solid #373327;
    border-radius:11px;padding:13px 14px;outline:none;min-width:0
}
.field input:focus,.field select:focus,.field textarea:focus,.search-input:focus{border-color:var(--gold)}
.field textarea{min-height:100px;resize:vertical}
.field select option{background:#171610}
.field input::placeholder,.field textarea::placeholder,.search-input::placeholder{color:#716d60}
.help{font-size:11px;line-height:1.8;color:#8d897c}
.search-row{display:flex;gap:10px;margin-bottom:18px}
.search-row .search-input{flex:1}
.ticket-list{display:grid;gap:20px}
.empty{
    padding:55px 20px;text-align:center;border:1px dashed #51472e;
    border-radius:18px;color:#969182;background:#191811
}
.empty .empty-icon{font-size:38px;margin-bottom:12px;color:var(--gold)}
.empty h3{color:#ded6c2;margin-bottom:8px}
.empty p{font-size:12px;line-height:2}

/* PREMIUM TICKET */
.ticket-wrap{max-width:950px;width:100%;margin:auto}
.ticket{
    display:grid;grid-template-columns:minmax(0,1fr) 230px;
    position:relative;isolation:isolate;overflow:hidden;border-radius:18px;
    background:#f7f0dd;color:#282316;
    border:1px solid #d2b86e;box-shadow:0 18px 55px #0005
}
.ticket:before{
    content:"";position:absolute;inset:8px;border:1px solid #c5a24f88;
    border-radius:12px;pointer-events:none;z-index:-1
}
.ticket-main{padding:27px 30px 25px;position:relative}
.ticket-top{display:flex;align-items:center;justify-content:space-between;gap:15px}
.ticket-brand{display:flex;align-items:center;gap:11px}
.ticket-brand-mark{
    width:42px;height:42px;border:1px solid #a98129;display:grid;place-items:center;
    color:#a98129;font-weight:900;font-size:24px;transform:rotate(45deg)
}
.ticket-brand-mark span{transform:rotate(-45deg)}
.ticket-brand-name{font-size:22px;letter-spacing:2px;font-weight:900}
.ticket-brand-name span{color:#a98129}
.ticket-label{
    font-size:10px;letter-spacing:2px;color:#8c6b23;border:1px solid #cdb36b;
    padding:7px 10px;border-radius:30px;white-space:nowrap
}
.ticket-rule{height:1px;background:linear-gradient(90deg,transparent,#c5a24f,transparent);margin:22px 0}
.ticket-caption{font-size:10px;color:#92762e;letter-spacing:2px;margin-bottom:7px}
.ticket-holder{font-size:clamp(22px,4vw,35px);font-weight:900;overflow-wrap:anywhere}
.ticket-details{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 15px;margin-top:25px}
.ticket-detail small{display:block;color:#8b8065;font-size:10px;margin-bottom:6px}
.ticket-detail strong{font-size:13px;overflow-wrap:anywhere}
.ticket-footer{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:25px}
.ticket-code{font-size:10px;letter-spacing:1px;color:#78612a;direction:ltr}
.ticket-side{
    position:relative;border-right:2px dashed #c8b16f;
    padding:25px 17px;display:flex;flex-direction:column;align-items:center;
    justify-content:center;text-align:center;
    background:linear-gradient(155deg,#e7d49a,#f8f0d7 55%,#dfc681)
}
.ticket-side:before,.ticket-side:after{
    content:"";position:absolute;right:-11px;width:20px;height:20px;
    border-radius:50%;background:#11100d;border:1px solid #c7a750
}
.ticket-side:before{top:-11px}
.ticket-side:after{bottom:-11px}
.vip-seal{
    width:75px;height:75px;border:1px solid #a47b24;outline:1px solid #a47b2470;
    outline-offset:5px;border-radius:50%;display:grid;place-items:center;
    color:#916a1d;font-weight:900;font-size:25px;margin-bottom:22px
}
.ticket-side h3{font-size:17px;color:#624816}
.ticket-side p{font-size:10px;color:#7e693b;line-height:2;margin-top:7px}
.qr-box{
    width:100px;height:100px;background:white;border:5px solid white;
    margin:20px 0 12px;display:grid;place-items:center;overflow:hidden
}
.qr-box img{width:100%;height:100%;object-fit:contain}
.qr-fallback{font-size:9px;color:#5d4b26;line-height:1.8}
.ticket-side .ticket-code{font-size:9px;overflow-wrap:anywhere}
.ticket-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}
.ticket-actions button{padding:10px 13px;font-size:11px}
.ticket-note{font-size:10px;color:#80775f;line-height:1.9;margin-top:15px}
.badge{
    display:inline-block;padding:5px 9px;border-radius:30px;
    font-size:10px;background:#2b271b;color:var(--gold);border:1px solid var(--border)
}
.admin-layout{display:grid;grid-template-columns:225px minmax(0,1fr);gap:20px}
.admin-sidebar{
    background:#191811;border:1px solid var(--border);border-radius:20px;
    padding:18px;height:max-content;position:sticky;top:95px
}
.admin-sidebar .side-title{color:var(--gold);font-size:11px;letter-spacing:1px;padding:9px 10px 15px}
.admin-sidebar button{
    display:block;width:100%;text-align:right;background:transparent;color:#bdb8a7;
    border:0;padding:12px;border-radius:10px;font-size:12px;margin-bottom:4px
}
.admin-sidebar button:hover,.admin-sidebar button.active{background:#302919;color:var(--gold)}
.admin-content{min-width:0}
.admin-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:18px}
.admin-stat{background:#201e16;border:1px solid var(--border);padding:17px;border-radius:15px}
.admin-stat small{display:block;color:#9c9787;font-size:11px}
.admin-stat strong{display:block;color:var(--gold);font-size:25px;margin-top:9px}
.table-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:450px}
th,td{text-align:right;padding:14px 12px;border-bottom:1px solid #373327;font-size:12px}
th{color:var(--gold);font-weight:800}
td{color:#d5d0c1}
td .btn{padding:7px 10px;font-size:10px}
.login-box{max-width:440px;margin:40px auto}
.login-icon{
    width:65px;height:65px;margin:0 auto 20px;display:grid;place-items:center;
    border:1px solid var(--gold);border-radius:18px;color:var(--gold);font-size:27px
}
.login-box h2{text-align:center;margin-bottom:8px}
.login-box>p{text-align:center;color:var(--muted);font-size:12px;line-height:2;margin-bottom:24px}
.admin-tab{display:none}
.admin-tab.active{display:block;animation:appear .3s}
.toast-container{position:fixed;bottom:20px;left:20px;z-index:200;display:grid;gap:10px}
.toast{
    background:#242219;color:#f5f0df;border:1px solid var(--border);
    border-radius:12px;padding:14px 18px;min-width:230px;max-width:calc(100vw - 40px);
    box-shadow:0 10px 30px #0006;font-size:12px;animation:appear .25s
}
.toast.success{border-color:#627c46}
.toast.error{border-color:#91443b}
footer{border-top:1px solid var(--border);padding:35px 20px;text-align:center;color:#827d6e}
.footer-brand{font-size:24px;letter-spacing:4px;color:var(--gold);font-weight:900}
footer p{font-size:11px;margin-top:10px}
.mobile-bottom{display:none}
.hidden{display:none!important}
@media(max-width:1000px){
    .hero{padding:45px}
    .hero-side{left:3%;opacity:.35}
    .hero-content{max-width:680px}
    .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
    .admin-layout{grid-template-columns:180px minmax(0,1fr)}
}
@media(max-width:760px){
    .nav{padding:12px 16px}
    .mobile-toggle{display:block}
    .navlinks{
        display:none;position:absolute;top:69px;right:12px;left:12px;
        background:#191811;border:1px solid var(--border);border-radius:16px;
        padding:10px;flex-direction:column;align-items:stretch;box-shadow:0 20px 50px #0009
    }
    .navlinks.open{display:flex}
    .navlinks button{text-align:right}
    main{padding:17px 14px 45px}
    .hero{min-height:440px;padding:35px 23px;border-radius:22px}
    .hero h1{font-size:43px}
    .hero p{font-size:13px}
    .hero-side{left:-100px;opacity:.18}
    .stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:15px 0 35px}
    .stat{padding:17px}
    .stat strong{font-size:25px}
    .section-head h2{font-size:23px}
    .grid{grid-template-columns:1fr}
    .form-grid{grid-template-columns:1fr}
    .field.full{grid-column:auto}
    .panel{padding:19px}
    .admin-layout{grid-template-columns:1fr}
    .admin-sidebar{position:static;display:flex;overflow-x:auto;gap:5px;padding:10px}
    .admin-sidebar .side-title{display:none}
    .admin-sidebar button{white-space:nowrap;width:auto;margin:0;padding:10px}
    .admin-stats{grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
    .admin-stat{padding:12px}
    .admin-stat strong{font-size:21px}
    .ticket{grid-template-columns:minmax(0,1fr) 115px;border-radius:13px}
    .ticket-main{padding:19px 16px}
    .ticket-side{padding:20px 8px}
    .ticket-brand-name{font-size:17px}
    .ticket-brand-mark{width:31px;height:31px;font-size:18px}
    .ticket-label{font-size:8px;padding:6px}
    .ticket-details{gap:15px 8px}
    .ticket-detail strong{font-size:11px}
    .ticket-holder{font-size:22px}
    .vip-seal{width:54px;height:54px;font-size:19px;margin-bottom:15px}
    .ticket-side h3{font-size:13px}
    .qr-box{width:75px;height:75px}
    .ticket-footer{align-items:flex-start;flex-direction:column}
    .ticket-actions button{flex:1}
    .mobile-bottom{
        display:flex;position:fixed;bottom:0;right:0;left:0;z-index:45;
        background:#171610f5;backdrop-filter:blur(15px);
        border-top:1px solid var(--border);padding:8px 5px calc(8px + env(safe-area-inset-bottom));
        justify-content:space-around
    }
    .mobile-bottom button{
        border:0;background:transparent;color:#9f9a89;font-size:10px;
        display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 8px
    }
    .mobile-bottom button span{font-size:18px}
    .mobile-bottom button.active{color:var(--gold)}
    body{padding-bottom:65px}
}
@media(max-width:390px){
    .ticket{grid-template-columns:minmax(0,1fr) 95px}
    .ticket-main{padding:16px 12px}
    .ticket-brand-name{font-size:15px}
    .ticket-label{letter-spacing:0}
    .ticket-details{grid-template-columns:1fr 1fr}
    .ticket-side .ticket-code{font-size:8px}
    .hero h1{font-size:37px}
}
@media print{
    @page{size:auto;margin:10mm}
    body{background:#fff!important;color:#000!important;padding:0!important}
    body *{visibility:hidden!important}
    #printArea,#printArea *{visibility:visible!important}
    #printArea{
        display:block!important;position:absolute;top:0;right:0;left:0;
        width:100%;margin:0;padding:0
    }
    .ticket-wrap{max-width:none}
    .ticket{box-shadow:none!important;print-color-adjust:exact;-webkit-print-color-adjust:exact}
    .ticket-actions,.ticket-note{display:none!important}
    .topbar,footer,.mobile-bottom,.toast-container{display:none!important}
}
</style>
</head>

<body>

<header class="topbar">
    <div class="nav">
        <div class="brand" onclick="go('home')">
            <div class="brand-mark"><span>H</span></div>
            <div class="brand-name">HOO<span>RI</span></div>
        </div>
        <button class="mobile-toggle" onclick="toggleMenu()" aria-label="باز کردن منو">☰ منو</button>
        <nav class="navlinks" id="navlinks">
            <button class="active" data-page="home" onclick="go('home')">خانه</button>
            <button data-page="hooris" onclick="go('hooris')">حوری‌ها</button>
            <button data-page="register" onclick="go('register')">ثبت بلیت</button>
            <button data-page="tickets" onclick="go('tickets')">بلیت‌ها</button>
            <button class="nav-admin" data-page="admin" onclick="go('admin')">♛ مدیریت</button>
        </nav>
    </div>
</header>

<main>

<section class="page active" id="home">
    <div class="hero">
        <div class="hero-content">
            <div class="eyebrow">THE PREMIUM EXPERIENCE</div>
            <h1>فراتر از یک<br><span>بلیت معمولی.</span></h1>
            <p>به دنیای HOORI خوش آمدی؛ تجربه‌ای متفاوت با طراحی اختصاصی، بلیت‌های ویژه و فضایی که جزئیاتش برای خاص بودن ساخته شده.</p>
            <div class="hero-actions">
                <button class="btn btn-gold" onclick="go('register')">✦ ثبت بلیت جدید</button>
                <button class="btn btn-outline" onclick="go('tickets')">مشاهده بلیت‌ها ←</button>
            </div>
        </div>
        <div class="hero-side" aria-hidden="true">
            <div class="hs-text">EXCLUSIVE ACCESS</div>
            <div class="hs-logo">H</div>
            <div class="hs-line"></div>
