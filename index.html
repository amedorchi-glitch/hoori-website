<!-- HOORI GOLDEN TICKETS -->
<style>
.hoori-ticket-zone {
  direction: rtl;
  padding: 45px 18px;
  margin: 35px auto;
  max-width: 1000px;
  font-family: Tahoma, sans-serif;
  color: #332713;
  background: linear-gradient(135deg, #fffdf7, #f7edcf);
  border: 1px solid #d6b45d;
  border-radius: 24px;
  box-shadow: 0 15px 45px #a8893820;
}
.hoori-ticket-zone * { box-sizing: border-box; }
.hoori-ticket-zone h2 {
  text-align: center;
  font-size: 28px;
  color: #a77b19;
}
.hoori-ticket-zone .intro {
  text-align: center;
  line-height: 2;
  color: #76643c;
}
.hoori-ticket-form {
  max-width: 500px;
  margin: 25px auto;
  display: grid;
  gap: 12px;
}
.hoori-ticket-form input,
.hoori-ticket-form select {
  width: 100%;
  padding: 14px;
  border: 1px solid #d9c17e;
  border-radius: 12px;
  background: white;
  color: #35280e;
  font: inherit;
}
.hoori-ticket-form button {
  padding: 14px;
  border: none;
  border-radius: 12px;
  background: linear-gradient(135deg,#f7e7a9,#c39a35);
  color: #352506;
  font-weight: bold;
  font-size: 15px;
  cursor: pointer;
}
.hoori-ticket-preview {
  display: none;
  max-width: 620px;
  margin: 25px auto;
}
.hoori-ticket-card {
  position: relative;
  overflow: hidden;
  padding: 28px 20px;
  border: 2px solid #d4ad4b;
  border-radius: 22px;
  background:
    radial-gradient(circle at top left,#fff3c9,transparent 45%),
    linear-gradient(135deg,#fffef9,#f7edcf);
  color: #493714;
  text-align: center;
  box-shadow: 0 12px 35px #9a782525;
}
.hoori-ticket-card::before {
  content: "✦";
  display: block;
  color: #c59a2c;
  font-size: 35px;
}
.hoori-ticket-brand {
  font-size: 12px;
  letter-spacing: 5px;
  color: #9d7722;
}
.hoori-ticket-card h3 {
  margin: 15px 0;
  font-size: 30px;
  color: #a67b1b;
}
.hoori-ticket-card .ticket-owner {
  font-size: 21px;
  font-weight: bold;
  overflow-wrap: anywhere;
}
.hoori-ticket-card .ticket-number {
  margin-top: 20px;
  padding-top: 15px;
  border-top: 1px dashed #c5a34e;
  font-size: 12px;
  letter-spacing: 2px;
}
.hoori-ticket-actions {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 10px;
  margin-top: 15px;
}
.hoori-ticket-actions button {
  border: 1px solid #c5a34e;
  border-radius: 10px;
  padding: 12px 18px;
  background: white;
  color: #785819;
  cursor: pointer;
  font: inherit;
}
@media(max-width:500px) {
  .hoori-ticket-zone h2 { font-size: 23px; }
  .hoori-ticket-card h3 { font-size: 25px; }
}
</style>

<section class="hoori-ticket-zone" id="hooriTicketMaker">
  <h2>🎟️ بلیط‌های اختصاصی HOORI</h2>
  <p class="intro">
    بلیط اختصاصی خودت رو بساز؛<br>
    طراحی سفید و طلایی، مخصوص دنیای حوری‌ها.
  </p>

  <form class="hoori-ticket-form" id="hooriTicketForm">
    <input id="hooriTicketName"
      maxlength="60"
      placeholder="اسم یا لقب صاحب بلیط"
      required>

    <select id="hooriTicketType">
      <option value="GOLDEN">بلیط GOLDEN ✨</option>
      <option value="VIP">بلیط VIP 👑</option>
      <option value="SPECIAL">بلیط SPECIAL 💎</option>
    </select>

    <button type="submit">ساخت بلیط اختصاصی ✦</button>
  </form>

  <div class="hoori-ticket-preview" id="hooriTicketPreview">
    <div class="hoori-ticket-card" id="hooriTicketCard">
      <div class="hoori-ticket-brand">HOORI · EXCLUSIVE</div>
      <h3 id="hooriTicketTitle">GOLDEN PASS</h3>
      <p>این بلیط اختصاصی تقدیم می‌شود به</p>
      <div class="ticket-owner" id="hooriTicketOwner"></div>
      <div class="ticket-number" id="hooriTicketNumber"></div>
      <p style="margin-top:15px;font-size:11px">
        THE GOLDEN WORLD · HOORI
      </p>
    </div>

    <div class="hoori-ticket-actions">
      <button type="button" id="hooriTicketDownload">
        دریافت تصویر بلیط
      </button>
      <button type="button" id="hooriTicketPrint">
        چاپ بلیط
      </button>
    </div>
  </div>
</section>

<script>
(function () {
  const form = document.getElementById("hooriTicketForm");
  const preview = document.getElementById("hooriTicketPreview");
  const owner = document.getElementById("hooriTicketOwner");
  const title = document.getElementById("hooriTicketTitle");
  const number = document.getElementById("hooriTicketNumber");
  const card = document.getElementById("hooriTicketCard");

  let currentTicket = null;

  const types = {
    GOLDEN: "GOLDEN PASS",
    VIP: "VIP GOLD PASS",
    SPECIAL: "SPECIAL GOLD PASS"
  };

  function escapeHTML(value) {
    return value.replace(/[&<>"']/g, function (char) {
      return {
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[char];
    });
  }

  form.addEventListener("submit", function (event) {
    event.preventDefault();

    const name = document
      .getElementById("hooriTicketName")
      .value.trim();

    const type = document
      .getElementById("hooriTicketType")
      .value;

    if (!name) {
      alert("اول اسم صاحب بلیط رو بنویس!");
      return;
    }

    const ticketNumber =
      "HR-" + Date.now().toString().slice(-8);

    currentTicket = {
      name: name,
      type: types[type],
      number: ticketNumber
    };

    owner.textContent = name;
    title.textContent = types[type];
    number.textContent = "TICKET ID: " + ticketNumber;

    preview.style.display = "block";
    preview.scrollIntoView({
      behavior: "smooth",
      block: "center"
    });
  });

  document.getElementById("hooriTicketDownload")
    .addEventListener("click", function () {
      if (!currentTicket) return;

      const svg = `
      <svg xmlns="http://www.w3.org/2000/svg"
           width="1000" height="600" viewBox="0 0 1000 600">
        <defs>
          <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#fff6cf"/>
            <stop offset="50%" stop-color="#dfc16b"/>
            <stop offset="100%" stop-color="#b88b27"/>
          </linearGradient>
        </defs>
        <rect width="1000" height="600" rx="35" fill="#fffdf6"/>
        <rect x="18" y="18" width="964" height="564" rx="28"
              fill="none" stroke="url(#gold)" stroke-width="7"/>
        <rect x="34" y="34" width="932" height="532" rx="22"
              fill="none" stroke="#dfc16b" stroke-width="2"/>
        <text x="500" y="115" text-anchor="middle"
              font-family="Georgia,serif" font-size="34"
              letter-spacing="12" fill="#9b7624">HOORI</text>
        <text x="500" y="225" text-anchor="middle"
              font-family="Georgia,serif" font-size="55"
              fill="#bd922d">${escapeHTML(currentTicket.type)}</text>
        <text x="500" y="305" text-anchor="middle"
              font-family="Arial,sans-serif" font-size="27"
              fill="#7c6533">EXCLUSIVE TICKET FOR</text>
        <text x="500" y="385" text-anchor="middle"
              font-family="Arial,sans-serif" font-size="43"
              font-weight="bold" fill="#5c4515">${escapeHTML(currentTicket.name)}</text>
        <line x1="150" y1="435" x2="850" y2="435"
              stroke="#d2b45b" stroke-width="2" stroke-dasharray="8 8"/>
        <text x="500" y="490" text-anchor="middle"
              font-family="Arial,sans-serif" font-size="23"
              letter-spacing="4" fill="#987526">${currentTicket.number}</text>
        <text x="500" y="535" text-anchor="middle"
              font-family="Georgia,serif" font-size="19"
              letter-spacing="5" fill="#987526">THE GOLDEN WORLD</text>
      </svg>`;

      const blob = new Blob(
        [svg],
        { type: "image/svg+xml;charset=utf-8" }
      );

      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");

      link.href = url;
      link.download = "HOORI-" + currentTicket.number + ".svg";
      link.click();

      setTimeout(function () {
        URL.revokeObjectURL(url);
      }, 1000);
    });

  document.getElementById("hooriTicketPrint")
    .addEventListener("click", function () {
      if (!currentTicket) return;
      window.print();
    });
})();
</script>
<!-- END HOORI GOLDEN TICKETS -->
