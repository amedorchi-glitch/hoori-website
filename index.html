<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HOORI</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Tahoma,Arial,sans-serif;
    background:#fff;
    color:#222;
}

header{
    background:#fff;
    border-bottom:2px solid #d4af37;
    padding:15px;
    position:sticky;
    top:0;
    z-index:10;
}

.header{
    max-width:1000px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
}

.logo{
    font-size:28px;
    font-weight:bold;
    color:#b88a00;
}

nav{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
}

nav button{
    border:1px solid #d4af37;
    background:white;
    color:#8a6700;
    padding:10px 14px;
    border-radius:10px;
    cursor:pointer;
}

nav button:hover{
    background:#d4af37;
    color:white;
}

main{
    max-width:1000px;
    margin:auto;
    padding:25px 15px;
}

.page{
    display:none;
}

.page.active{
    display:block;
}

.hero{
    padding:50px 25px;
    text-align:center;
    border:1px solid #e3cc7b;
    border-radius:20px;
    background:linear-gradient(135deg,#fff,#fff8df);
}

.hero h1{
    color:#b88a00;
    font-size:50px;
    margin:0;
}

.hero p{
    color:#777;
    line-height:2;
}

button{
    cursor:pointer;
}

.btn{
    border:0;
    padding:12px 18px;
    border-radius:10px;
    margin-top:12px;
    font-weight:bold;
}

.gold{
    background:#c49a22;
    color:white;
}

.red{
    background:#c0392b;
    color:white;
}

.card{
    border:1px solid #e3cc7b;
    border-radius:15px;
    padding:20px;
    margin:12px 0;
    background:white;
}

.grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
}

input,
select{
    width:100%;
    padding:13px;
    margin:8px 0 15px;
    border:1px solid #d8c78f;
    border-radius:9px;
    font-size:15px;
}

.form{
    max-width:600px;
    margin:auto;
    border:1px solid #e3cc7b;
    border-radius:18px;
    padding:25px;
}

.message{
    padding:12px;
    margin-top:12px;
    border-radius:8px;
    display:none;
}

.message.show{
    display:block;
}

.success{
    background:#e8f7e8;
    color:#237523;
}

.error{
    background:#ffe8e8;
    color:#a52828;
}

footer{
    text-align:center;
    padding:30px;
    color:#999;
    border-top:1px solid #eee;
    margin-top:50px;
}

@media(max-width:700px){

    .header{
        flex-direction:column;
    }

    .grid{
        grid-template-columns:1fr;
    }

    nav{
        justify-content:center;
    }

}
</style>
</head>

<body>

<header>

<div class="header">

<div class="logo">
HOORI
</div>

<nav>

<button onclick="showPage('home')">
خانه
</button>

<button onclick="showPage('hooris')">
حوری‌ها
</button>

<button onclick="showPage('register')">
ثبت تیکت
</button>

<button onclick="showPage('tickets')">
تیکت‌ها
</button>

<button onclick="showPage('admin')">
مدیریت
</button>

</nav>

</div>

</header>


<main>


<!-- HOME -->

<section id="home" class="page active">

<div class="hero">

<h1>HOORI</h1>

<p>
به سامانه HOORI خوش آمدید
</p>

<button
class="btn gold"
onclick="showPage('register')"
>
ثبت تیکت
</button>

</div>

<div class="card">

<h2>
حوری پیشنهادی
</h2>

<div id="suggested">
هنوز حوری پیشنهادی انتخاب نشده.
</div>

</div>

</section>


<!-- HOORIS -->

<section id="hooris" class="page">

<h2>
حوری‌ها
</h2>

<div id="hooriList" class="grid"></div>

</section>


<!-- REGISTER -->

<section id="register" class="page">

<h2>
ثبت تیکت
</h2>

<div class="form">

<label>
نام و نام خانوادگی
</label>

<input
id="fullName"
type="text"
placeholder="نام و نام خانوادگی"
/>


<label>
انتخاب حوری
</label>

<select id="hooriSelect">

<option value="">
انتخاب کنید
</option>

</select>


<label>
نوع تیکت
</label>

<select id="ticketType">

<option value="normal">
عادی
</option>

<option value="vip">
VIP
</option>

</select>


<button
class="btn gold"
onclick="registerTicket()"
>
ثبت تیکت
</button>


<div id="registerMessage" class="message"></div>

</div>

</section>


<!-- TICKETS -->

<section id="tickets" class="page">

<h2>
تیکت‌ها
</h2>

<input
id="search"
placeholder="جستجو..."
oninput="renderTickets()"
/>

<div id="ticketList"></div>

</section>


<!-- ADMIN -->

<section id="admin" class="page">

<div id="loginBox" class="form">

<h2>
ورود مدیریت
</h2>

<input
id="password"
type="password"
placeholder="رمز مدیریت"
/>

<button
class="btn gold"
onclick="login()"
>
ورود
</button>

<div id="loginMessage" class="message"></div>

</div>


<div id="panel" style="display:none;">

<div class="card">

<h2>
پنل مدیریت
</h2>

<button
class="btn red"
onclick="logout()"
>
خروج
</button>

</div>


<div class="card">

<h3>
افزودن حوری
</h3>

<input
id="newHoori"
placeholder="نام حوری"
/>

<button
class="btn gold"
onclick="addHoori()"
>
افزودن
</button>

</div>


<div class="card">

<h3>
حوری پیشنهادی
</h3>

<select id="suggestSelect"></select>

<button
class="btn gold"
onclick="saveSuggested()"
>
ذخیره
</button>

</div>


<div class="card">

<h3>
مدیریت حوری‌ها
</h3>

<div id="adminHooris"></div>

</div>


<div class="card">

<h3>
مدیریت تیکت‌ها
</h3>

<div id="adminTickets"></div>

</div>

</div>

</section>

</main>


<footer>

HOORI ©

</footer>


<script>

/* =========================
   اطلاعات
========================= */

const PASSWORD = "Hoori1405";

let hoorIs = [];

let tickets = [];

let suggested = "";


/* =========================
   ذخیره اطلاعات
========================= */

function save(){

localStorage.setItem(
"hoori_hooris",
JSON.stringify(hoorIs)
);

localStorage.setItem(
"hoori_tickets",
JSON.stringify(tickets)
);

localStorage.setItem(
"hoori_suggested",
suggested
);

}


/* =========================
   دریافت اطلاعات
========================= */

function load(){

try{

hoorIs =
JSON.parse(
localStorage.getItem("hoori_hooris")
) || [];

tickets =
JSON.parse(
localStorage.getItem("hoori_tickets")
) || [];

suggested =
localStorage.getItem("hoori_suggested")
|| "";

}catch(e){

hoorIs=[];
tickets=[];
suggested="";

}

}


/* =========================
   تغییر صفحه
========================= */

function showPage(page){

const pages =
document.querySelectorAll(".page");

pages.forEach(function(item){

item.classList.remove("active");

});


const selected =
document.getElementById(page);

if(selected){

selected.classList.add("active");

}


if(page === "hooris"){

renderHooris();

}

if(page === "register"){

loadSelect();

}

if(page === "tickets"){

renderTickets();

}

if(page === "admin"){

renderAdmin();

}

if(page === "home"){

renderSuggested();

}

window.scrollTo(0,0);

}


/* =========================
   نمایش حوری‌ها
========================= */

function renderHooris(){

const box =
document.getElementById("hooriList");

if(!hoorIs.length){

box.innerHTML =
"<div class='card'>هنوز حوری‌ای اضافه نشده.</div>";

return;

}


box.innerHTML =
hoorIs.map(function(name){

return `

<div class="card">

<h3>
👑 ${name}
</h3>

<p>
عضو سامانه HOORI
</p>

</div>

`;

}).join("");

}


/* =========================
   انتخاب حوری
========================= */

function loadSelect(){

const select =
document.getElementById("hooriSelect");

select.innerHTML =
"<option value=''>انتخاب کنید</option>";


hoorIs.forEach(function(name){

const option =
document.createElement("option");

option.value = name;

option.textContent = name;

select.appendChild(option);

});

}


/* =========================
   ثبت تیکت
========================= */

function registerTicket(){

const name =
document.getElementById("fullName")
.value
.trim();

const hoori =
document.getElementById("hooriSelect")
.value;

const type =
document.getElementById("ticketType")
.value;

const message =
document.getElementById("registerMessage");


if(!name){

message.textContent =
"نام و نام خانوادگی را وارد کنید.";

message.className =
"message show error";

return;

}


if(!hoori){

message.textContent =
"یک حوری انتخاب کنید.";

message.className =
"message show error";

return;

}


tickets.push({

id:Date.now(),

name:name,

hoori:hoori,

type:type,

date:new Date().toLocaleString("fa-IR")

});


save();


document.getElementById("fullName")
.value = "";


message.textContent =
"✅ تیکت با موفقیت ثبت شد.";

message.className =
"message show success";


renderTickets();

}


/* =========================
   نمایش تیکت‌ها
========================= */

function renderTickets(){

const box =
document.getElementById("ticketList");

const search =
document.getElementById("search")
?.value
.toLowerCase()
.trim()
|| "";


const list =
tickets.filter(function(ticket){

return (

ticket.name
.toLowerCase()
.includes(search)

||

ticket.hoori
.toLowerCase()
.includes(search)

);

});


if(!list.length){

box.innerHTML =
"<div class='card'>تیکتی وجود ندارد.</div>";

return;

}


box.innerHTML =
list
.slice()
.reverse()
.map(function(ticket){

return `

<div class="card">

<h3>
${ticket.name}
</h3>

<p>
حوری: ${ticket.hoori}
</p>

<p>
نوع:
${ticket.type === "vip" ? "⭐ VIP" : "عادی"}
</p>

<p>
${ticket.date}
</p>

<button
class="btn gold"
onclick="printTicket(${ticket.id})"
>
چاپ
</button>

</div>

`;

})
.join("");

}


/* =========================
   ورود مدیریت
========================= */

function login(){

const password =
document.getElementById("password")
.value;

const message =
document.getElementById("loginMessage");


if(password === PASSWORD){

document.getElementById("loginBox")
.style.display="none";

document.getElementById("panel")
.style.display="block";

renderAdmin();

}else{

message.textContent =
"❌ رمز اشتباه است.";

message.className =
"message show error";

}

}


/* =========================
   خروج
========================= */

function logout(){

document.getElementById("panel")
.style.display="none";

document.getElementById("loginBox")
.style.display="block";

document.getElementById("password")
.value="";

}


/* =========================
   افزودن حوری
========================= */

function addHoori(){

const input =
document.getElementById("newHoori");

const name =
input.value.trim();


if(!name){

alert("نام حوری را وارد کنید.");

return;

}


if(hoorIs.includes(name)){

alert("این حوری قبلاً وجود دارد.");

return;

}


hoorIs.push(name);

save();

input.value="";

renderHooris();

loadSelect();

renderAdmin();

alert("✅ حوری اضافه شد.");

}


/* =========================
   پیشنهاد
========================= */

function saveSuggested(){

const select =
document.getElementById("suggestSelect");

suggested =
select.value;

save();

renderSuggested();

alert("✅ ذخیره شد.");

}


/* =========================
   نمایش پیشنهاد
========================= */

function renderSuggested(){

const box =
document.getElementById("suggested");


if(!suggested){

box.innerHTML =
"هنوز حوری پیشنهادی انتخاب نشده.";

return;

}


box.innerHTML = `

<h3>
⭐ ${suggested}
</h3>

`;

}


/* =========================
   پنل مدیریت
========================= */

function renderAdmin(){

const adminHooris =
document.getElementById("adminHooris");

const adminTickets =
document.getElementById("adminTickets");

const suggestSelect =
document.getElementById("suggestSelect");


if(!adminHooris) return;


/* حوری‌ها */

if(!hoorIs.length){

adminHooris.innerHTML =
"حوری‌ای وجود ندارد.";

}else{

adminHooris.innerHTML =
hoorIs.map(function(name,index){

return `

<div class="card">

<b>
${name}
</b>

<br>

<button
class="btn red"
onclick="deleteHoori(${index})"
>
حذف حوری
</button>

</div>

`;

}).join("");

}


/* پیشنهاد */

suggestSelect.innerHTML =
"<option value=''>بدون پیشنهاد</option>";


hoorIs.forEach(function(name){

const option =
document.createElement("option");

option.value=name;

option.textContent=name;

if(name === suggested){

option.selected=true;

}

suggestSelect.appendChild(option);

});


/* تیکت‌ها */

if(!tickets.length){

adminTickets.innerHTML =
"تیکتی وجود ندارد.";

}else{

adminTickets.innerHTML =
tickets
.slice()
.reverse()
.map(function(ticket){

return `

<div class="card">

<b>
${ticket.name}
</b>

<p>
${ticket.hoori}
</p>

<button
class="btn red"
onclick="deleteTicket(${ticket.id})"
>
حذف تیکت
</button>

</div>

`;

})
.join("");

}

}


/* =========================
   حذف حوری
========================= */

function deleteHoori(index){

if(!confirm("حذف شود؟")){

return;

}


const deleted =
hoorIs[index];

hoorIs.splice(index,1);


if(suggested === deleted){

suggested="";

}


save();

renderAdmin();

renderHooris();

loadSelect();

renderSuggested();

}


/* =========================
   حذف تیکت
========================= */

function deleteTicket(id){

if(!confirm("این تیکت حذف شود؟")){

return;

}


tickets =
tickets.filter(function(ticket){

return ticket.id !== id;

});


save();

renderAdmin();

renderTickets();

}


/* =========================
   چاپ
========================= */

function printTicket(id){

const ticket =
tickets.find(function(item){

return item.id === id;

});


if(!ticket){

return;

}


const win =
window.open("","_blank");


if(!win){

alert("اجازه باز شدن صفحه چاپ داده نشد.");

return;

}


win.document.write(`

<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<title>HOORI</title>

<style>

body{
font-family:Tahoma;
padding:40px;
text-align:center;
}

.box{
border:2px solid #d4af37;
padding:30px;
border-radius:20px;
max-width:500px;
margin:auto;
}

h1{
color:#b88a00;
}

</style>

</head>

<body>

<div class="box">

<h1>HOORI</h1>

<h2>
${ticket.name}
</h2>

<p>
حوری: ${ticket.hoori}
</p>

<p>
نوع:
${ticket.type === "vip" ? "VIP" : "عادی"}
</p>

<p>
${ticket.date}
</p>

</div>

<script>

window.onload=function(){

window.print();

};

<\/script>

</body>

</html>

`);

win.document.close();

}


/* =========================
   شروع برنامه
========================= */

load();

renderHooris();

loadSelect();

renderTickets();

renderSuggested();

showPage("home");

</script>

</body>
</html>
